# Codomyrmex Manuscript Configuration
# An Artificial Ecology for Agentic Software Development
# This file serves as a meta-artifact linking the prose of the manuscript to the execution
# layer. It is loaded by the duplicate-key rejecting safe loader in
# `src/codomyrmex/manuscript/variables.py` and by `scripts/compile_manuscript.py`
# (manuscript metadata) and `scripts/z_generate_manuscript_variables.py`
# (experiment parameters).

# Consumed by: `scripts/compile_manuscript.py`
paper:
  # RASP Standard: Title must be descriptive and objective
  title: "Codomyrmex: An Artificial Ecology for Agentic Software Development"
  subtitle: "Colony Control Plane, Stigmergic Pressure, and Falsification-Gated Actuation"
  version: "1.3.0"
  date: "auto"
  # Initial presentation setting; tune as needed and regenerate/review the PDF.
  # This affects layout only and is not a scientific or calibrated parameter.
  pdf_margin: "0.58in"
  cover:
    image: "figures/cover.png"

# The shared template is a versioned build dependency. Generation uses this
# exact clean checkout when it is available and records an explicit local
# successor mode for standalone clones where the sibling checkout is absent.
template:
  repository: "docxology/template"
  revision: "0cb18ad052c1253c0b4e2f3b397fc67c75f6f0a0"
  hydration_entrypoint: "infrastructure.rendering.manuscript_injection.write_resolved_manuscript_tree"

# Figure metadata is the single source for manuscript captions, evidence class,
# labels, and layout widths. Captions may contain {{TOKEN}} references; the
# variable generator resolves them from live runtime/configuration evidence.
figures:
  cover:
    filename: "cover.png"
    label: "fig:cover"
    width: "95%"
    evidence_class: "schematic"
    caption: >-
      Conceptual cover for the Colony Control Plane. The visual identity combines
      the implemented subsystems and signal motifs; it is not quantitative evidence.
    alt_text: >-
      {{CONFIG_PROJECT_SHORT_NAME}} cover: dark radial schematic of the Colony Kernel
      hub connected to
      {{CONFIG_OPERATIONAL_SUBSYSTEM_COUNT}} labelled control-plane subsystems.
    long_description: >-
      A bright Colony Kernel hub sits at the centre of a dark field. Labelled nodes
      for pheromone storage, resources, gating, consequence memory, roles, pruning,
      and falsification surround it, joined by luminous spokes and signal trails.
      The composition is conceptual branding rather than a measured network.
  colony_pressure_loop:
    filename: "colony_pressure_loop.png"
    label: "fig:pressure_loop"
    width: "80%"
    evidence_class: "schematic"
    caption: >-
      Conceptual Colony Kernel feedback dependencies. Proposal review reads budget,
      local RISK/FAILURE pressure, role, trust, and completeness; a separate caller
      may execute an approved action and report its outcome; recording then changes
      trust, resource usage, and signal traces used on a later proposal. Arrows show
      feedback dependencies rather than exact runtime call order.
    alt_text: >-
      Numbered circular flow from proposal submission through review, gate decision,
      caller actuation, outcome reporting, state update, and pheromone deposit.
    long_description: >-
      Eight labelled cards form a clockwise loop. A proposal is falsification-checked,
      witnessed against state, and evaluated by the gate before a separate caller may
      actuate it. The caller then reports an outcome, which updates trust, budget, role,
      and local pheromone pressure for later proposals. Numbers and arrow direction,
      rather than colour alone, define the sequence.
  pheromone_decay:
    filename: "pheromone_decay.png"
    label: "fig:pheromone_decay"
    width: "88%"
    evidence_class: "analytic"
    caption: >-
      Analytical trajectories of a {{CONFIG_SCORE_MAX}}-strength trace under the
      implemented subtractive decay rule. Each curve is
      $x_{j,t}=\max({{CONFIG_SCORE_MIN}},x_{j,0}-\epsilon_j t)$,
      with no deposits, reads, or reinforcement. Vertical markers show continuous
      extinction points; the runtime updates at integer ticks and removes values at
      or below zero. Distinct dash patterns and direct endpoint labels identify the
      decay classes without relying on colour. {{CONFIG_PARAMETER_STATUS_SHORT}}
      Parameters are generated from the manuscript snapshot.
    alt_text: >-
      Three directly labelled descending trajectories show FAST, NORMAL, and SLOW
      subtractive decay, each ending at its marked extinction tick.
    long_description: >-
      All traces begin at strength {{CONFIG_SCORE_MAX}} and decline linearly toward
      {{CONFIG_SCORE_MIN}}. FAST has the steepest slope and earliest vertical
      extinction marker, NORMAL is intermediate, and SLOW extends furthest to the
      right. Line style, endpoint label, and colour redundantly identify each class;
      the curves are analytical rather than observed time series.
  gate_score_heatmap:
    filename: "gate_score_heatmap.png"
    label: "fig:gate_heatmap"
    width: "90%"
    evidence_class: "analytic"
    caption: >-
      Formula-derived gate decision landscape over trust and effective local hazard
      pressure, where hazard is the maximum of RISK and FAILURE. Budget and
      completeness are fixed at {{CONFIG_UNIT_SCORE}}; configured hazard boundaries
      are {{CONFIG_HAZARD_MEDIUM_THRESHOLD}} and {{CONFIG_HAZARD_HIGH_THRESHOLD}},
      and trust below {{CONFIG_TRUST_HARD_FLOOR}} forces refusal. Colours encode
      configured decision bands redundantly with in-region decision labels and
      threshold annotations. This is an analytical policy map, not an observed
      proposal distribution. {{CONFIG_PARAMETER_STATUS_SHORT}}
    alt_text: >-
      Heatmap of REFUSE, HOLD, and EXECUTE regions over trust and effective hazard,
      with decision names and thresholds printed inside the policy map.
    long_description: >-
      Trust increases from left to right and effective local hazard increases from
      bottom to top. A dark left band marks the hard trust-floor refusal region.
      Beyond it, labelled REFUSE, HOLD, and EXECUTE regions change at the configured
      hazard and score boundaries. Region position, printed names, and colour all
      encode the decision; the grid is formula-derived, not an observed distribution.
  trust_trajectory:
    filename: "trust_trajectory.png"
    label: "fig:trust_trajectory"
    width: "90%"
    evidence_class: "deterministic-fixture"
    caption: >-
      Deterministic trust trajectory under consecutive caller-reported clean
      outcomes through the configured {{CONFIG_TRUST_TRAJECTORY_HORIZON}}-outcome
      horizon. Shaded bands show inferred role labels; the independent generated gate
      floor means the first role promotion does not yet make ordinary gate scoring
      reachable. Points are analytical applications of the fixed update, not
      population measurements or evidence of stochastic convergence.
      {{CONFIG_PARAMETER_STATUS_SHORT}}
    alt_text: >-
      Stepwise trust trajectory crossing labelled role thresholds after clean
      reports, with the independent gate floor marked separately.
    long_description: >-
      A monotone stair-step line starts at sandbox trust and rises after each
      caller-reported clean outcome. Horizontal threshold lines and directly named
      background bands show the inferred roles. A separate gate hard-floor line
      demonstrates that the first role promotion does not itself make ordinary
      scoring reachable. The path is a deterministic fixture, not a population trend.
  falsification_vectors:
    filename: "falsification_vectors.png"
    label: "fig:falsification_vectors"
    width: "90%"
    evidence_class: "code-taxonomy"
    caption: >-
      Falsification categories ordered by the highest severity emitted by their live
      heuristic checks. Horizontal position, a printed severity initial, and colour
      redundantly encode severity class; one category may be served by more than one
      check. The empty CRITICAL band denotes the only finding class that hard-refuses
      before ordinary scoring. The chart is a code-taxonomy visualization, not a
      measured detection-rate comparison.
    alt_text: >-
      Horizontal severity chart placing every falsification category in a labelled
      LOW, MEDIUM, HIGH, or CRITICAL band with an initial printed on each marker.
    long_description: >-
      Each row names one live adversarial vector. A line ends at that vector's
      highest emitted severity rank, and the marker contains the severity initial.
      Rows are sorted from highest to lowest severity. The CRITICAL column is
      explicitly labelled even when empty because that class alone hard-refuses
      before scoring. The plot shows code taxonomy, not prevalence or detection rate.
  subsystem_architecture:
    filename: "subsystem_architecture.png"
    label: "fig:architecture"
    width: "80%"
    evidence_class: "schematic"
    caption: >-
      Colony Control Plane topology. ColonyKernel owns subsystem lifecycle and
      sequencing; the live integration object supplies the operational leaf-node
      count, and the nodes exchange typed value objects from the shared models.py
      contract. Node labels, radial position, and arrow direction identify each
      functional role; colour is a secondary cue. The diagram shows ownership and
      information flow, not deployment topology or performance.
    alt_text: >-
      Hub-and-spoke diagram with ColonyKernel at the centre and
      {{CONFIG_OPERATIONAL_SUBSYSTEM_COUNT}} labelled subsystem nodes around it.
    long_description: >-
      ColonyKernel occupies the central hub. Radial spokes connect it bidirectionally
      to the labelled Pheromone Store, Resource Ledger, Actuation Gate, Consequence
      Memory, Role Adapter, Pruning Daemon, and Falsification Worker nodes. Subtitles
      state each node's function, and arrowheads show information flow. The topology
      describes software ownership, not hosts, latency, or throughput.
  gate_score_3d:
    filename: "gate_score_3d.png"
    label: "fig:gate_score_3d"
    width: "92%"
    evidence_class: "analytic"
    caption: >-
      Analytical gate-score surface with budget and local hazard clearance fixed at
      {{CONFIG_UNIT_SCORE}}. The implementation's trust hard floor and trust-credit
      tiers are shown; completeness is plotted continuously as a visual envelope even
      though runtime completeness is discrete. Threshold planes identify the
      configured HOLD and EXECUTE boundaries. This is formula-derived, not an
      empirical risk surface. {{CONFIG_PARAMETER_STATUS_SHORT}}
    alt_text: >-
      Gate-score surface over trust and completeness with labelled HOLD and EXECUTE
      thresholds plus a projection of distinct trust slices.
    long_description: >-
      The main panel rises across completeness and changes in discrete tiers across
      trust, with horizontal threshold planes marking HOLD and EXECUTE. A companion
      projection uses distinct line styles, point shapes, direct labels, and colour
      for selected trust slices. The continuous completeness surface is a visual
      envelope over a runtime input that is actually discrete.
  fep_correspondence:
    filename: "fep_correspondence.png"
    label: "fig:fep_correspondence"
    width: "95%"
    evidence_class: "conceptual-analogy"
    caption: >-
      Schematic vocabulary crosswalk between Free Energy Principle terms and Colony
      Kernel artifacts. Each row names an FEP concept, the kernel artifact proposed as
      an analogue, and the intended engineering intuition. The correspondence is
      conceptual: the current kernel does not implement Bayesian inference or formal
      equivalence with expected free energy.
    alt_text: >-
      Row-by-row correspondence diagram linking Free Energy Principle terms to named
      Colony Kernel artifacts and bounded engineering interpretations.
    long_description: >-
      Each horizontal row begins with an FEP concept, points to a specific kernel
      artifact, and ends with an engineering interpretation. The repeated three-part
      layout and text labels carry the mapping; coloured row accents only aid scanning.
      A warning beneath the rows states that the current deterministic kernel is not a
      Bayesian controller and the correspondences are analogies, not equivalences.
  research_roadmap:
    filename: "research_roadmap.png"
    label: "fig:research_roadmap"
    width: "96%"
    evidence_class: "research-plan"
    caption: >-
      Configured research roadmap for the Colony Kernel. The
      {{CONFIG_RESEARCH_ROADMAP_STAGE_COUNT}} milestones move from the implemented
      contract and local authenticated ledger toward external-actuation attestation,
      adversarial evaluation, calibration, persistence, and a probabilistic extension.
      Status labels describe the current research state, not empirical results or
      delivery guarantees; each milestone remains conditional on its stated artifact,
      metric, falsifier, and exit criterion.
    alt_text: >-
      {{CONFIG_RESEARCH_ROADMAP_STAGE_COUNT}} vertically connected milestone cards
      progress from implemented local contracts to a research-stage probabilistic
      extension.
    long_description: >-
      Milestones run top to bottom through reproducibility, a local authenticated
      lifecycle ledger, external-actuation attestation, adversarial evaluation,
      calibration, persistence and concurrency, and a probabilistic extension. Every
      card prints its current status and an abbreviated required-evidence artifact.
      Directional arrows, sequence identifiers, and status text define the dependency
      order; colour is redundant and no milestone promises delivery or success.
  formalism_code_crosswalk:
    filename: "formalism_code_crosswalk.png"
    label: "fig:formalism_code_crosswalk"
    width: "96%"
    evidence_class: "formal-crosswalk"
    caption: >-
      Abbreviated evidence-oriented crosswalk from formal objects to typed code
      anchors, translation mechanisms, executable evidence, and claim boundaries.
      Every row prints its status; coloured strips provide a redundant navigation cue.
      Full, searchable wording follows in the adjacent manuscript tables. The visual
      records correspondence and missing links; it is not a proof graph or evidence
      of scientific equivalence.
    alt_text: >-
      {{CONFIG_FORMALISM_CROSSWALK_COUNT}}-row, three-column crosswalk linking each
      formal object and printed status to code translation, evidence, and a claim limit.
    long_description: >-
      Each row identifies a formalism and explicitly prints IMPLEMENTED, PARTIAL, or
      RESEARCH. The middle column abbreviates its typed code anchors and translation
      bridge; the final column abbreviates executable evidence and the strongest claim
      the evidence does not support. Alternating row shading and status-colour strips
      aid navigation, while the full wording remains available in searchable tables.
  replay_contract:
    filename: "replay_contract.png"
    label: "fig:replay_contract"
    width: "96%"
    evidence_class: "deterministic-fixture"
    caption: >-
      Fixed-input paired-locality replay derived from real Colony Kernel subsystems. The
      same-target score changes from {{RESULT_PAIRED_CLEAR_SCORE}}/EXECUTE to
      {{RESULT_PAIRED_FAILURE_SCORE}}/HOLD after a caller-reported failure, while the
      unrelated target remains at {{RESULT_PAIRED_UNRELATED_SCORE}}/EXECUTE with
      effective hazard {{RESULT_PAIRED_UNRELATED_PRESSURE}}, and passive
      decay restores {{RESULT_PAIRED_RECOVERED_SCORE}}/EXECUTE. The replay is repeated
      for semantic equality; it is not an attestation, causal estimate, or external
      workload result. {{CONFIG_PARAMETER_STATUS_SHORT}}
    alt_text: >-
      Four-state paired-locality replay showing clear, failed-target, unrelated-target,
      and recovered decisions while the unrelated target remains unchanged.
    long_description: >-
      Four ordered states show an EXECUTE decision for a clear target, a caller-reported
      failure that moves the same target to HOLD, an unrelated target that remains at
      EXECUTE, and passive decay that restores the original decision. State order,
      decision words, score labels, and arrows carry the comparison;
      colours are redundant and the fixture is not causal or externally attested.
  attestation_event_chain:
    filename: "attestation_event_chain.png"
    label: "fig:attestation_event_chain"
    width: "96%"
    evidence_class: "authenticated-fixture"
    caption: >-
      Authenticated local lifecycle fixture with {{RESULT_ATTESTATION_EVENT_COUNT}}
      linked events and validation status {{RESULT_ATTESTATION_CHAIN_VALID}}. The
      chain binds proposal, verdict, authorization, execution receipt, and outcome
      digests under the configured signer; it establishes ledger integrity, not that
      the action was safe, useful, or independently observed.
    alt_text: >-
      Top-to-bottom authenticated event chain from proposal through verdict,
      authorization, execution receipt, and outcome.
    long_description: >-
      Five numbered event nodes are connected top to bottom by directional arrows.
      Each row prints its event type, actor, hash prefix, and signature state. The
      chain order binds proposal, gate verdict, authorization, caller-supplied
      execution receipt, and caller-supplied outcome digests under the configured
      signer. The linked structure establishes fixture-level ledger integrity only;
      it does not verify external actuation, safety, or usefulness.
  safety_utility_frontier:
    filename: "safety_utility_frontier.png"
    label: "fig:safety_utility_frontier"
    width: "88%"
    evidence_class: "offline-synthetic"
    caption: >-
      Paired safety--utility points from {{RESULT_BENCHMARK_PAIR_COUNT}} deterministic
      synthetic tool-use cases, with denominator N={{RESULT_BENCHMARK_TASK_COUNT}}
      task cases per condition. Baseline and reference-gate-mediated harmful-action rates are
      {{RESULT_BENCHMARK_BASELINE_HARM_RATE}} and
      {{RESULT_BENCHMARK_MEDIATED_HARM_RATE}}, with utilities
      {{RESULT_BENCHMARK_BASELINE_UTILITY}} and
      {{RESULT_BENCHMARK_MEDIATED_UTILITY}}. The paired harmful-action difference is
      {{RESULT_BENCHMARK_HARM_DELTA}} ({{RESULT_BENCHMARK_HARM_DIFFERENCE_DIRECTION}})
      with a descriptive percentile-resampling interval from
      {{RESULT_BENCHMARK_CI_METHOD}} at a nominal {{RESULT_BENCHMARK_CI_LEVEL}}%
      reference level
      [{{RESULT_BENCHMARK_HARM_CI_LOW}}, {{RESULT_BENCHMARK_HARM_CI_HIGH}}]. The
      interval uses task-case pairs, not a population sample, and is not a conventional
      inferential confidence interval ({{RESULT_BENCHMARK_INTERVAL_INTERPRETATION}}).
      The plotted mediator is {{RESULT_BENCHMARK_MEDIATOR_PROVENANCE}}; production-gate
      parity is {{RESULT_BENCHMARK_PRODUCTION_GATE_PARITY}}. This fixture demonstrates
      analysis plumbing, not calibration or generalization to external agents or
      workloads. Marker shape, direct labels, and colour redundantly identify the two
      conditions.
    alt_text: >-
      Scatter plot comparing directly labelled always-execute and independent-reference-gate
      conditions on harmful-action rate and fixture utility, using different marker shapes.
    long_description: >-
      Harmful-action rate is on the horizontal axis and utility is on the vertical
      axis, both averaged over the same ordered synthetic task cases. One labelled point
      represents the always-execute baseline and a differently shaped labelled point
      represents the independent ReferenceGate-mediated condition; an arrow annotates
      the paired mediated-minus-baseline harm difference and its descriptive interval.
      The points come from deterministic synthetic cases. The mediator is not the
      production ActuationGate, parity is not established, and the interval does not
      imply population generalization or calibration.
  calibration_reliability:
    filename: "calibration_reliability.png"
    label: "fig:calibration_reliability"
    width: "88%"
    evidence_class: "calibration-status"
    caption: >-
      Calibration status panel for the current evidence bundle: primary calibration
      is {{RESULT_CALIBRATION_STATUS}} and log-loss analysis is {{RESULT_CALIBRATION_ECE}}.
      Gate scores and trust values are not probabilities; a reliability estimate will
      be rendered only after independently observed held-out outcomes and declared
      confidence values are available.
    alt_text: >-
      Reliability-diagram placeholder with an ideal diagonal and a prominent
      {{RESULT_CALIBRATION_STATUS}} status notice instead of invented calibration data.
    long_description: >-
      The square plotting area shows only the ideal-reference diagonal. A central
      status card states that calibration is {{RESULT_CALIBRATION_STATUS}} and that
      expected calibration error is {{RESULT_CALIBRATION_ECE}}. No bins or empirical
      points are drawn because gate and trust scores are not probabilities and the
      required held-out outcomes and declared confidence values are absent.
  persistence_recovery:
    filename: "persistence_recovery.png"
    label: "fig:persistence_recovery"
    width: "88%"
    evidence_class: "restart-fixture"
    caption: >-
      SQLite-backed signal restart fixture. The retained failure signal after closing
      and reopening the store is {{RESULT_PERSISTENCE_RESTART_STRENGTH}}; the durable
      canonical logical database artifact digest is
      {{RESULT_PERSISTENCE_ARTIFACT_SHA256}}.
      This is a durability check, not a throughput or crash-survival claim.
    alt_text: >-
      Restart-fixture bar chart comparing signal strength at deposit, after reopening
      SQLite storage, and after recovery, with values printed above the bars.
    long_description: >-
      Three ordered bars report the signal's strength when deposited, after the store
      is closed and reopened, and at the fixture's recovery observation. Numeric labels
      are printed above the bars so height and colour are not the only encodings. The
      retained record supports a narrow logical durability check, not throughput,
      arbitrary crash survival, or persistence of all kernel state.
  formalism_coverage:
    filename: "formalism_coverage.png"
    label: "fig:formalism_coverage"
    width: "88%"
    evidence_class: "formalism-inventory"
    caption: >-
      Current formalism-to-code inventory with {{RESULT_FORMAL_CROSSWALK_TOTAL}}
      mappings: {{RESULT_FORMAL_CROSSWALK_IMPLEMENTED}} implemented and
      {{RESULT_FORMAL_CROSSWALK_PARTIAL}} partial, with
      {{RESULT_FORMAL_CROSSWALK_RESEARCH}} research. The chart measures documented
      bridge status and evidence anchors, not theorem coverage or semantic equivalence.
      Segment labels and position redundantly encode the status counts.
    alt_text: >-
      Three vertical bars summarize implemented, partial, and research formalism
      mappings, with counts printed above each bar.
    long_description: >-
      Three separate vertical bars partition all {{RESULT_FORMAL_CROSSWALK_TOTAL}}
      configured formalism mappings into IMPLEMENTED, PARTIAL, and RESEARCH bridge
      statuses. Each bar prints its status and count above the bar, while a legend
      repeats the categories. Height, order, text, and colour provide redundant
      encodings. The inventory counts documented mappings, not proved theorems or
      semantic equivalences.
  research_status_matrix:
    filename: "research_status_matrix.png"
    label: "fig:research_status_matrix"
    width: "96%"
    evidence_class: "research-status"
    caption: >-
      Evidence-status matrix for the configured roadmap and formalism crosswalk.
      Status labels are generated from the active configuration and indicate what
      artifacts exist or remain conditional; they are not completion guarantees or
      measured implementation outcomes. Each row's marker position and printed status
      column carry the classification; colour is redundant.
    alt_text: >-
      Status dot matrix listing roadmap milestones and formalism mappings by labelled
      status columns, with one marker and row label per item.
    long_description: >-
      Rows name configured roadmap stages and formalism mappings. Each row places a
      single marker under its printed IMPLEMENTED, PARTIAL, NEXT, PLANNED, or RESEARCH
      column, so horizontal position and text define the status independently of
      colour. The matrix is a configuration-backed navigation aid, not evidence that
      conditional work is complete or empirically successful.

# Shared by the manuscript compiler and `python -m codomyrmex.release`.
authors:
  - name: "Daniel Ari Friedman"
    alias: "docxology"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    orcid: "0000-0001-6232-9096"
    corresponding: true

# Rendered through CONFIG_ACKNOWLEDGEMENTS in the final, unnumbered section.
acknowledgements:
  - name: "Marek Pawel Bargiel"
    contribution: "conceptual comments on pressure-aware gating / colony-control framing"

# Publication identity for the source-bound technical report. The concept DOI
# resolves to the Zenodo record family; version_doi identifies this release.
publication:
  type: "technical-report"
  doi: "10.5281/zenodo.21750800"
  doi_status: "assigned"
  version_doi: "10.5281/zenodo.21750801"
  version_record: "https://zenodo.org/records/21750801"
  release_tag: "v1.3.0-paper"
  github_repository: "docxology/codomyrmex"
  transmission_bookends:
    enabled: true
  year: "2026"
  provenance:
    mode: "transparent"
    visible_bookends: true
    qr_links: true
    hash_algorithms:
      - "sha256"
      - "sha512"
    hidden_payloads: false
    encryption: false

keywords:
  - "ai-agents"
  - "model-context-protocol"
  - "mcp"
  - "multi-agent"
  - "orchestration"
  - "colony-control-plane"
  - "stigmergy"
  - "artificial-ecology"
  - "agentic-software-engineering"
  - "falsification-worker"
  - "actuation-gate"
  - "trust-scoring"

metadata:
  license: "MIT"
  language: "en"

# Protocol references are external standards, not compatibility assertions.
protocols:
  mcp:
    official_revision: "2026-07-28"
    specification_url: "https://modelcontextprotocol.io/specification/2026-07-28"

# `scripts/compile_manuscript.py` is the authoritative HTML/PDF renderer.
# Detached artifact hashes are written by `codomyrmex.release`.
render:
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false

# Consumed by manuscript review tooling.
# See docs/ for details
llm:
  reviews:
    # Explicitly enabled for this exemplar to demonstrate AI-aided analysis
    enabled: true
    types:
      - executive_summary
      - quality_review
      - methodology_review
  translations:
    enabled: true
    languages:
      - zh

# Consumed by: `infrastructure/reporting/pipeline_report_model.py` and CI/CD gates
# ZERO-MOCK TOLERANCE: Any failure blocks manuscript rendering
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Stage 02 runs only manuscript build producers, in this declared order.
# Compilation belongs to the Stage 03 render override, not analysis discovery.
analysis:
  scripts:
    - z_generate_manuscript_variables.py
    - generate_manuscript_figures.py

# Research milestones are deliberately configuration-backed. Each row must state
# the hypothesis, artifact, decisive metric, falsifier, and exit criterion so that
# the manuscript distinguishes a testable program from an unsupported promise.
research_roadmap:
  - id: "R0"
    name: "Reproducible kernel contract"
    status: "implemented"
    artifact_paths:
      - "src/codomyrmex/colony_kernel/replay.py"
      - "tests/unit/colony_kernel/test_replay.py"
      - "tests/unit/colony_kernel/test_manuscript_consistency.py"
      - "docs/manuscript/06_reproducibility.md"
    hypothesis: "The local control-plane contract can be replayed from the checked-in source and configuration."
    artifact: "Scoped tests, coverage record, variable map, figure registry, and rendered manuscript."
    metric: "Replay agreement for gate, locality, decay, and provenance outputs."
    falsifier: "Any replay depends on an undocumented input or produces a contradictory contract result."
    exit_criteria: "Fresh generation and focused gates pass with hashes recorded."
  - id: "R1"
    name: "Local authenticated lifecycle ledger"
    status: "implemented"
    artifact_paths:
      - "src/codomyrmex/colony_kernel/attestation.py"
      - "tests/unit/colony_kernel/test_attestation.py"
      - "tests/unit/colony_kernel/test_kernel_attestation_integration.py"
    hypothesis: "Optional and required kernel modes can bind proposal, verdict, authorization, execution receipt, and outcome records locally."
    artifact: "Signed, hash-linked local event ledger with nonce, actor, proposal digest, verdict, execution receipt, and outcome."
    metric: "Forgery, replay, sequence, actor, and linkage rejection in deterministic tests."
    falsifier: "The local ledger accepts a forged, replayed, reordered, mismatched, or incomplete lifecycle."
    exit_criteria: "Lifecycle integration tests pass and the external-observation boundary remains explicit."
  - id: "R2"
    name: "End-to-end external actuation attestation"
    status: "next"
    hypothesis: "Independently sourced execution evidence can distinguish actual external actuation from caller-reported lifecycle events."
    artifact: "Deployment-specific adapter that verifies execution identity, external receipt provenance, and outcome linkage."
    metric: "Forgery and replay rejection, observation completeness, adapter overhead, and independently replayed traces."
    falsifier: "A caller can report or relink an action or outcome without verifiable external execution evidence."
    exit_criteria: "A declared deployment adapter passes adversarial tests and an independent verifier reproduces its evidence chain."
  - id: "R3"
    name: "Adversarial tool-use benchmark"
    status: "planned"
    hypothesis: "Gate-mediated proposals will change unsafe-action and recovery outcomes under hostile tool inputs."
    artifact: "Seeded AgentDojo, InjecAgent, or ToolEmu adapter with paired baseline traces."
    metric: "Attack success, harmful-action rate, task utility, refusal cost, and complete trace retention."
    falsifier: "The mediated condition does not improve the preregistered safety-utility frontier."
    exit_criteria: "Independent rerun reproduces paired estimates and failure analyses."
  - id: "R4"
    name: "Calibration and utility"
    status: "planned"
    hypothesis: "Gate scores can be calibrated against independently observed downstream consequences."
    artifact: "Held-out outcome dataset, baseline policies, calibration analysis, and preregistered configuration."
    metric: "Log loss, calibration error, selective risk, repair cost, utility, and confidence intervals."
    falsifier: "Scores remain miscalibrated or add friction without a defensible utility trade-off."
    exit_criteria: "Held-out analysis and uncertainty intervals are released with raw traces."
  - id: "R5"
    name: "Persistence and concurrency"
    status: "planned"
    hypothesis: "Explicit persistence and concurrent access can preserve locality without violating isolation or ordering."
    artifact: "Restart, crash-recovery, multi-worker, and load scenarios under a declared deployment profile."
    metric: "Durability, ordering, isolation, throughput, latency, and recovery completeness."
    falsifier: "Restart or concurrency causes silent signal loss, cross-target contamination, or unsafe duplicate actuation."
    exit_criteria: "Scenario matrix passes with retained logs, seeds, environment, and artifact hashes."
  - id: "R6"
    name: "Probabilistic and Active Inference extension"
    status: "research"
    hypothesis: "An explicit generative model can improve prediction or policy selection beyond the heuristic projection."
    artifact: "Declared likelihood, posterior implementation, simulation-based calibration, and paired baselines."
    metric: "Posterior predictive checks, held-out log loss, calibration, policy utility, and compute cost."
    falsifier: "The probabilistic model fails calibration or utility comparisons, or its assumptions are not identifiable."
    exit_criteria: "Model, assumptions, replay harness, and negative results are independently reproducible."

# Formalism-to-code mappings are a second, evidence-oriented research contract. A
# mapping is not accepted merely because names sound similar: it must identify the
# formal object, the executable translation, retained evidence, and the claim boundary.
formalism_code_crosswalk:
  - id: "F0"
    name: "Typed operational semantics"
    status: "implemented"
    formalism: "State-transition contract"
    formal_object: "Proposal, verdict, reported consequence, and kernel state transition"
    code_symbols: "ActionProposal; GateResult; ColonyKernel.propose_action; ColonyKernel.record_outcome; run_paired_locality_replay"
    code_paths:
      - "src/codomyrmex/colony_kernel/models.py"
      - "src/codomyrmex/colony_kernel/kernel.py"
      - "src/codomyrmex/colony_kernel/replay.py"
    bridge: "Dataclasses and enums define the vocabulary; kernel sequencing defines the transition boundary."
    evidence_paths:
      - "tests/unit/colony_kernel/test_kernel.py"
      - "tests/unit/colony_kernel/test_models.py"
      - "tests/unit/colony_kernel/test_replay.py"
    evidence: "Typed construction, lifecycle sequencing, repeatable replay, and serialized result tests."
    claim_boundary: "Establishes a replayable interface and control-flow contract, not semantic safety or execution attestation."
  - id: "F1"
    name: "Discrete dynamical recurrence"
    status: "implemented"
    formalism: "Bounded state recurrence"
    formal_object: "x_(j,t+1)=max(0, x_(j,t)-ε_j) for a trace without new deposits"
    code_symbols: "PheromoneStore.evaporate; PheromoneStore.tick; TraceField.sense"
    code_paths:
      - "src/codomyrmex/colony_kernel/pheromone_store.py"
      - "src/codomyrmex/agentic_memory/stigmergy/field.py"
    bridge: "Per-signal metadata supplies epsilon; integer ticks apply the floored subtraction and delete depleted markers."
    evidence_paths:
      - "tests/unit/colony_kernel/test_pheromone_store.py"
      - "tests/unit/colony_kernel/test_property_stress_integration.py"
    evidence: "Decay, floor, compound-key isolation, and stress/property scenarios."
    claim_boundary: "Supports the stated recurrence under declared inputs; it is not exponential forgetting, wall-clock decay, or biological pheromone chemistry."
  - id: "F2"
    name: "Piecewise decision semantics"
    status: "implemented"
    formalism: "Rule system with hard overrides"
    formal_object: "Weighted score, hazard tiers, and EXECUTE/HOLD/REFUSE precedence"
    code_symbols: "ActuationGate.witness_state; ActuationGate.evaluate; FalsificationWorker.evaluate_plan"
    code_paths:
      - "src/codomyrmex/colony_kernel/actuation_gate.py"
      - "src/codomyrmex/colony_kernel/falsification/worker.py"
    bridge: "Named thresholds and ordered branches implement the piecewise policy; no opaque learned scorer is implied."
    evidence_paths:
      - "tests/unit/colony_kernel/test_actuation_gate.py"
      - "tests/unit/colony_kernel/test_falsification_worker.py"
    evidence: "Boundary, precedence, monotonicity, and adversarial-vector tests."
    claim_boundary: "Proves only the coded policy properties; the score is not a probability of safety, harm, or utility."
  - id: "F3"
    name: "Runtime invariant predicates"
    status: "partial"
    formalism: "Executable design-by-contract checks"
    formal_object: "Bounds, monotone role thresholds, enum separation, and gate-weight conservation"
    code_symbols: "all_invariants_hold; ColonySignal.__post_init__; ResourceCost.__post_init__"
    code_paths:
      - "src/codomyrmex/colony_kernel/invariants.py"
      - "src/codomyrmex/colony_kernel/models.py"
    bridge: "Predicates and constructor guards execute against live constants; a dedicated crosswalk test checks source alignment."
    evidence_paths:
      - "tests/unit/colony_kernel/test_models.py"
      - "tests/unit/colony_kernel/test_invariants.py"
    evidence: "Direct invariant checks plus boundary regressions; cross-module coverage remains incomplete."
    claim_boundary: "Runtime predicates detect selected violations for supplied states; they are not a complete proof of all kernel behaviors."
  - id: "F4"
    name: "Structural code-change verification"
    status: "implemented"
    formalism: "AST-preservation rules"
    formal_object: "No deletion of public functions, no removed parameters, and order-compatible signatures"
    code_symbols: "ChangeProposal; CodeChangeVerifier.verify; InvariantRule"
    code_paths:
      - "src/codomyrmex/formal_verification/code_change_verifier.py"
      - "src/codomyrmex/formal_verification/gated_rewrite.py"
    bridge: "Python source is parsed into ASTs and compared by pluggable rule functions before optional attestation."
    evidence_paths:
      - "tests/unit/test_v130_foundations.py"
    evidence: "Real-source AST regression tests for preserved public structure and custom rules."
    claim_boundary: "Covers selected structural compatibility properties; it does not establish behavioral equivalence, security, or deployability."
  - id: "F5"
    name: "SMT invariant proving"
    status: "partial"
    formalism: "Satisfiability-based proof obligation"
    formal_object: "C AND not(invariant) is unsatisfiable"
    code_symbols: "KernelFormalSnapshot; runtime_obligations; prove_kernel_obligations"
    code_paths:
      - "src/codomyrmex/colony_kernel/formal.py"
      - "src/codomyrmex/formal_verification/z3_bridge.py"
      - "tests/unit/colony_kernel/test_formal_bridge.py"
      - "tests/unit/formal_verification/test_z3_bridge.py"
    bridge: "A solver-neutral obligation model and bounded kernel-specific Z3 encoding translate selected runtime bounds, weight conservation, pressure monotonicity, locality, and authorized linkage obligations into solver expressions."
    evidence_paths:
      - "tests/unit/colony_kernel/test_formal_bridge.py"
      - "tests/unit/formal_verification/test_z3_bridge.py"
    evidence: "Structured solver outcomes and counterexample handling are tested for the kernel-specific bounded encoding; the optional solver path reports unavailable when Z3 is absent."
    claim_boundary: "The bridge proves or refutes the encoded bounded obligations; it does not establish whole-program refinement, production safety, or a proof of the Python kernel."
  - id: "F6"
    name: "Probabilistic and Active Inference models"
    status: "research"
    formalism: "Generative model, posterior, and policy evaluation"
    formal_object: "p(o,s), q(s), transition/observation models, preferences, and expected free energy"
    code_symbols: "KernelProbabilisticAdapter; GenerativeModelSpec; BayesianNetwork; InferenceEngine.infer; VariationalFreeEnergy.compute; ActiveInferenceAgent"
    code_paths:
      - "src/codomyrmex/colony_kernel/research/probabilistic.py"
      - "src/codomyrmex/cerebrum/inference/bayesian.py"
      - "src/codomyrmex/cerebrum/inference/active_inference.py"
    bridge: "The explicit adapter declares kernel observations, latent states, priors, likelihoods, transitions, preferences, actions, and horizon while preserving the deterministic gate as the baseline."
    evidence_paths:
      - "tests/unit/colony_kernel/test_research_harness.py"
      - "tests/unit/cerebrum/unit/test_bayesian.py"
      - "tests/unit/test_v131_intelligence.py"
    evidence: "Standalone Cerebrum tests and explicit adapter-schema tests; held-out posterior evaluation and production policy integration remain unexecuted."
    claim_boundary: "The adapter is research plumbing, not an integrated Active Inference controller, calibrated safety model, or expected-free-energy implementation."

# Manuscript projections of runtime policy plus proposed-study parameters.
# Runtime policy remains authoritative in src/codomyrmex/colony_kernel; variable
# generation fails if any runtime projection below differs from live code.
experiment:
  # Evidence qualifier reused across prose and figure captions. These values are
  # defaults/illustrative settings, not fitted empirical parameters; changing a
  # runtime or presentation input requires regenerating the evidence chain.
  parameter_status_note: >-
    The numeric values shown here are current implementation defaults or illustrative
    initial settings, not universal constants, fitted parameters, or empirical
    estimates. They are configurable and can be tuned or replaced through the corresponding runtime policy,
    configuration, or presentation inputs; after a change, regenerate the tests,
    tables, figures, and manuscript before interpreting the result.
  parameter_status_short: >-
    Current default/illustrative policy values; configurable, not empirically calibrated.

  # Colony Kernel gate thresholds:
  #   Execute (proceed with actuation):   gate_score >= 0.75
  #   Hold (pause, request review):       gate_score >= 0.50 and < 0.75
  #   REFUSE (reject, log, escalate):    gate_score < 0.50
  gate_execute_threshold: 0.75
  gate_hold_threshold: 0.50

  # Trust score boundaries for agent role lifecycle:
  #   New agent default: trust = 0.10, role = SANDBOX
  #   Minimum proposals before promotion: 3
  #   REPAIR_ANT:        trust >= 0.20
  #   MEMORY_ANT:        trust >= 0.35
  #   DISPATCHER:        trust >= 0.50
  #   GUARD_ANT:         trust >= 0.70
  #   Gate hard floor:   trust < 0.30 -> REFUSE before scoring
  trust_sandbox_score: 0.10
  trust_hard_floor: 0.30
  trust_promote_threshold: 0.20
  # Standalone RoleAdapter assign_role() thresholds (not used by kernel path):
  trust_standalone_repair_threshold: 0.80
  trust_standalone_guard_threshold: 0.85

  # Pheromone / stigmergic signal types broadcast on the colony bus.
  # Each signal type carries a payload and decays independently.
  colony_signal_types:
    - FAILURE
    - SUCCESS
    - RISK
    - NEED
    - DEPENDENCY
    - HUMAN_PRIORITY

  # Base evaporation rate applied once per scheduler tick (constant _BASE_EVAPORATION
  # in pheromone_store.py). DecayRate multipliers (FAST=3.0, NORMAL=1.0, SLOW=0.2)
  # scale this value to give per-signal effective evaporation rates.
  # Effective rates: FAST=0.30/tick, NORMAL=0.10/tick, SLOW=0.02/tick.
  base_evaporation_rate: 0.1

  # Pheromone decay rate classes (maps to numeric decay constants):
  #   FAST:   3.0  — transient alerts (e.g. FAILURE, RISK); subtract 0.30 per tick
  #   NORMAL: 1.0  — standard/default coordination signals (e.g. NEED)
  #   SLOW:   0.2  — persistent memory signals (e.g. SUCCESS, HUMAN_PRIORITY)
  decay_rates:
    - FAST    # 3.0
    - NORMAL  # 1.0
    - SLOW    # 0.2

  # Agent role taxonomy in the Codomyrmex colony:
  #   SANDBOX:      untrusted new agents; all proposals hard-refused by the gate
  #   REPAIR_ANT:   inferred label; no action-specific permissions are enforced
  #   MEMORY_ANT:   inferred label; no action-specific permissions are enforced
  #   DISPATCHER:   inferred label; no action-specific permissions are enforced
  #   GUARD_ANT:    inferred label; no independent veto authority is implemented
  agent_roles:
    - SANDBOX
    - REPAIR_ANT
    - MEMORY_ANT
    - DISPATCHER
    - GUARD_ANT

  # Multi-dimensional budget tracked per actuation request.
  # Gate score incorporates budget consumption as one weighted dimension.
  budget_dimensions:
    - llm_calls
    - runtime_seconds
    - risk_level
    - human_attention_minutes
    - merge_risk
    - doc_debt
    - security_exposure

  # Gate score composition weights (must sum to 1.0):
  #   budget:       0.30  — resource consumption relative to colony budget envelope
  #   risk:         0.30  — static + dynamic risk signals from GUARD_ANT verdicts
  #   trust:        0.25  — requesting agent's current trust score
  #   completeness: 0.15  — evidence completeness (tests, docs, falsification vectors)
  gate_score_weights:
    budget: 0.30
    risk: 0.30
    trust: 0.25
    completeness: 0.15

  # Canonical trust score deltas per outcome type.
  # Sourced from models.py constants (_TRUST_DELTA_PASS / _TRUST_DELTA_FAIL).
  # Changing these values propagates automatically to manuscript Tables 2 and 3
  # via CONFIG_TRUST_DELTA_PASS / CONFIG_TRUST_DELTA_FAIL tokens.
  trust_delta_pass: 0.04     # +0.04 per successful outcome (no repair)
  trust_delta_fail: -0.08    # -0.08 per failed outcome

  # Falsification attack vectors applied per actuation proposal.
  # The FalsificationWorker used by both propose_action and colony_falsify_plan
  # applies 10 deterministic adversarial attack vectors (see §5.6 and §2 AttackVector table):
  # NO_ROLLBACK, NO_TEST_VALUE, SCOPE_CREEP, FALSE_METRIC, CIRCULAR_ARCHITECTURE,
  # DEPENDENCY_RISK, SECURITY_RISK, OVER_BROAD_MODULE, HIDDEN_MAINTENANCE_COST,
  # PREMATURE_ABSTRACTION.
  falsification_vectors: 10

  # Colony Control Plane subsystem count — the 8 design subsystems:
  # pheromone_gradients, resource_budget, actuation_gate, consequence_memory,
  # role_adaptation, death_and_pruning, falsification_worker, lifecycle_coordination
  # (the ColonyKernel coordinator itself counts as the 8th).
  colony_kernel_subsystems: 8

  # MCP tool surface exposed by the colony control plane.
  # Manuscript Table 2 enumerates these tools by name and capability class.
  mcp_tool_count: 8

  # Number of config.yaml files managed across the colony (including this file).
  # Used as a manifest integrity check token in z_generate_manuscript_variables.py.
  config_yaml_files: 3

  # Number of agents initialised per trial at AgentRole.SANDBOX with trust_score = 0.1.
  # Referenced in 05_experimental_setup.md §5.0.4 as CONFIG_AGENT_COUNT.
  agent_count: 5

  # Number of task subtrees in the fixed workload corpus used per trial.
  # Referenced in 05_experimental_setup.md §5.0.4 as CONFIG_WORKLOAD_TASK_COUNT.
  workload_task_count: 50

  # Scheduler ticks designated as warm-up at the start of each trial.
  # Warm-up outcomes are excluded from dependent-variable computations.
  # Referenced in 05_experimental_setup.md §5.0.4 and §5.0.5 as CONFIG_WARMUP_TICKS.
  warmup_ticks: 10

  # Planned run count for the proposed evaluation protocol. No repeated-trial
  # benchmark artifact is shipped in this release; seed 0 is the deterministic
  # replay seed reserved for the future paired harness.
  trial_count: 20
  seed: 0

  # Proposed benchmark condition registry; its length is injected wherever the
  # manuscript states the condition count.
  benchmark_conditions:
    - composite_gate
    - static_trust
    - budget_only
    - always_execute

  # Presentation checkpoints for tables whose values are generated by applying
  # the live runtime recurrence and role adapter.
  trust_trajectory_checkpoints: [0, 3, 5, 6, 9, 12, 15]
  decay_table_ticks: [0, 1, 2, 4, 8, 10]

  # Presentation parameters are configuration, not hidden figure constants. They
  # control sampling density and illustrative horizons while scientific values remain
  # derived from the live kernel below.
  figure_parameters:
    score_min: 0.0
    score_max: 1.0
    heatmap_grid_points: 160
    heatmap_pressure_max: 10.0
    decay_plot_horizon_ticks: 10
    decay_plot_points: 600
    gate_surface_grid_points: 60
    gate_surface_trust_slices: [0.2, 0.5, 0.9]
    trust_plot_projection_margin: 6

  # Exact deterministic fixture inputs. Scores, pressure, decisions, and table
  # rows are produced by executing real Colony Kernel subsystem instances.
  paired_fixture:
    agent_trust: 0.50
    recovery_ticks: 20
