# Codomyrmex exemplar: infrastructure adapters limited to the integration boundary.
#
# The colony_kernel/ modules (kernel.py, actuation_gate.py, falsification/worker.py,
# pheromone_store.py, pruning_daemon.py, consequence_memory.py, resource_ledger.py,
# role_adapter.py, models.py, config_loader.py) are the main scientific layer and
# MUST remain infrastructure-free.  They import only stdlib and internal codomyrmex
# packages so the colony control-plane is forkable as a standalone package.
#
# Top-level modules: kernel.py, actuation_gate.py, attestation.py,
# config_loader.py, consequence_memory.py, falsification_worker.py (shim),
# formal.py, invariants.py, mcp_tools.py, models.py, pheromone_store.py,
# pruning_daemon.py, reference.py, replay.py, resource_ledger.py,
# role_adapter.py.
#
# Sub-packages: falsification/ (worker.py, import_graph.py, models.py,
# checks/), research/ (benchmark.py, metrics.py, persistent_store.py,
# probabilistic.py, schemas.py).
#
# The manuscript pipeline now lives entirely in the package and project-local scripts.
# No file under src/codomyrmex/ is permitted to import infrastructure.*.
#
# Enforcement: verified by test_layer_contract_forbids_infrastructure_imports in
# tests/unit/colony_kernel/test_manuscript_consistency.py, which asserts every
# *.py file under src/codomyrmex/ imports no infrastructure.* symbol.
allow_infrastructure_imports:
  []
