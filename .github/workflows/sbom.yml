name: SBOM Generation

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate CycloneDX SBOM
        run: |
          uv export --locked \
            --preview-features sbom-export \
            --format cyclonedx1.5 \
            --all-groups \
            --all-extras \
            --no-emit-project \
            --quiet \
            --output-file sbom.cdx.json

      - name: Generate SPDX SBOM via Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release@v3.0.3
        with:
          files: |
            sbom.cdx.json
            sbom.spdx.json
