name: Auto-Merge Labelled PRs

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge labelled PRs
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Auto-merge eligible PRs
        # Only PRs a person labelled `auto-merge`, with every check finished
        # and none failed. Branch names are not a signal (see the script).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --limit 200 \
            --json number,labels,statusCheckRollup,mergeable,isDraft \
            > prs.json
          python3 scripts/maintenance/auto_merge_eligible.py < prs.json > eligible.txt
          while read -r number; do
            [ -n "$number" ] || continue
            echo "Merging #$number"
            gh pr merge "$number" --squash --delete-branch \
              || echo "::warning::PR #$number could not be merged"
          done < eligible.txt
