name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.8"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --group docs --all-extras --dev

      - name: Install native integration prerequisites
        # A stalled mirror or registry used to hang the job until its 60 min limit.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install --yes --no-install-recommends espeak-ng
          for image in python:3.9-slim bash:5.1; do
            for attempt in 1 2 3; do
              timeout 180 docker pull "$image" && break
              [ "$attempt" -eq 3 ] && exit 1
              sleep $((attempt * 10))
            done
          done

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-whisper-base-v1

      - name: Run integration tests (strict)
        run: |
          uv run pytest tests/integration/ \
            -n auto \
            --timeout=120 \
            --no-header \
            -q \
            --tb=short \
            --junit-xml=junit-integration.xml
        env:
          CODOMYRMEX_ENV: ci
          CODOMYRMEX_INTEGRATION: "1"

      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-evidence
          path: junit-integration.xml
          if-no-files-found: error
