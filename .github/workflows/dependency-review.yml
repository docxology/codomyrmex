# Audit every locked group/extra without requiring GitHub Dependency graph.
name: Dependency Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Audit the complete dependency lock
        run: uv run --locked --extra security_audit python scripts/security/audit_uv_lock.py
