# Audit every locked group/extra without requiring GitHub Dependency graph.
name: Dependency Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # astral-sh/setup-uv@v10.4.0

      - name: Audit the complete dependency lock
        run: uv run --locked --extra security_audit python scripts/security/audit_uv_lock.py
