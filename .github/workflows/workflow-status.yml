name: Workflow Status Dashboard

# Previously triggered by the completion of 20 workflows (about a third of all
# Actions runs), with a hard-coded workflow list whose names had drifted from
# the real ones. It now refreshes after CI finishes on main, daily, and on
# demand, and discovers workflows from the API so it cannot drift.
on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: workflow-status
  cancel-in-progress: true

permissions: {}

jobs:
  update-status:
    name: Update Workflow Status Dashboard
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Collect the latest main-branch run of every active workflow
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 },
            );
            const rows = [];
            for (const wf of workflows) {
              if (wf.state !== 'active' || wf.path.endsWith('/workflow-status.yml')) continue;
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: wf.id, branch: 'main', per_page: 1,
              });
              const run = data.workflow_runs[0];
              rows.push({
                name: wf.name,
                file: wf.path.split('/').pop(),
                status: run ? (run.conclusion || run.status) : 'no main run',
                url: run ? run.html_url : '',
                updatedAt: run ? run.updated_at : '',
                event: run ? run.event : '',
              });
            }
            rows.sort((a, b) => a.name.localeCompare(b.name));
            require('fs').writeFileSync(
              'workflow-status.json',
              JSON.stringify({ updated: new Date().toISOString(), workflows: rows }, null, 2),
            );

      - name: Render dashboard
        run: |
          python3 - <<'PY'
          import json

          data = json.load(open("workflow-status.json", encoding="utf-8"))
          icons = {"success": "✅", "failure": "❌", "cancelled": "⏹️",
                   "in_progress": "🔄", "queued": "🔄", "skipped": "⏭️"}
          rows = data["workflows"]
          ok = sum(r["status"] == "success" for r in rows)
          failed = [r for r in rows if r["status"] == "failure"]
          lines = [
              "# Workflow Status Dashboard",
              "",
              f"Updated {data['updated']} · latest run on `main` per workflow · "
              f"{ok}/{len(rows)} successful, {len(failed)} failed",
              "",
              "| Workflow | File | Status | Last run | Event |",
              "| --- | --- | --- | --- | --- |",
          ]
          for r in rows:
              icon = icons.get(r["status"], "❓")
              name = f"[{r['name']}]({r['url']})" if r["url"] else r["name"]
              lines.append(
                  f"| {name} | `{r['file']}` | {icon} {r['status']} | "
                  f"{r['updatedAt'][:16].replace('T', ' ') or 'n/a'} | {r['event'] or 'n/a'} |"
              )
          with open("workflow-status.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          for r in failed:
              print(f"::warning title=Failing on main::{r['name']} ({r['file']}) {r['url']}")
          PY
          cat workflow-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload status artifacts
        uses: actions/upload-artifact@v7
        with:
          name: workflow-status-report
          path: |
            workflow-status.json
            workflow-status.md
          retention-days: 30
