name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/codomyrmex/documentation/**'
      - 'docs/**'
      - '.github/lighthouse-ci.json'
      - '.github/scripts/serve_docs_site.sh'
      - '.github/workflows/lighthouse-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/codomyrmex/documentation/package-lock.json

      - name: Install documentation dependencies
        working-directory: src/codomyrmex/documentation
        run: npm ci

      - name: Build the deployed documentation site
        working-directory: src/codomyrmex/documentation
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: .github/lighthouse-ci.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          # The config starts .github/scripts/serve_docs_site.sh, which serves the
          # build under /codomyrmex/ exactly as GitHub Pages does. Serving the
          # build at the server root makes every asset 404 and reports a perfect
          # score for a page that shipped no CSS or JavaScript.

      - name: Report medians across the runs
        # The assertion of record. `lhci assert` reports the most favourable run
        # of the set (`found: 2527.09` against LCP 3,445 / 2,549 / 2,527 ms), so
        # a site that breaches two runs in three reads green there. This step
        # asserts the medians every run actually measured.
        run: node .github/scripts/check_lighthouse_medians.js .lighthouseci 90 2500

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));
            const lhr = JSON.parse(fs.readFileSync(results[0].jsonPath, 'utf8'));
            const perf = Math.round(lhr.categories.performance.score * 100);
            const a11y = Math.round(lhr.categories.accessibility.score * 100);
            const bp = Math.round(lhr.categories['best-practices'].score * 100);
            const seo = Math.round(lhr.categories.seo.score * 100);
            const lcp = Math.round(lhr.audits['largest-contentful-paint'].numericValue);
            const body = `## Lighthouse Results (deployed build)\n\n| Metric | Score |\n|--------|-------|\n| Performance | ${perf} |\n| Accessibility | ${a11y} |\n| Best Practices | ${bp} |\n| SEO | ${seo} |\n| LCP | ${lcp} ms |`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
