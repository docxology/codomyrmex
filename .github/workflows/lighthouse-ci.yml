name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --locked --group docs --all-extras

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: .github/lighthouse-ci.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          # Lighthouse rejects file:// URLs (INVALID_URL). The config's
          # staticDistDir makes LHCI serve ./site over a local HTTP server.

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));
            const lhr = JSON.parse(fs.readFileSync(results[0].jsonPath, 'utf8'));
            const perf = Math.round(lhr.categories.performance.score * 100);
            const a11y = Math.round(lhr.categories.accessibility.score * 100);
            const bp = Math.round(lhr.categories['best-practices'].score * 100);
            const seo = Math.round(lhr.categories.seo.score * 100);
            const body = `## 🏠 Lighthouse Results\n\n| Metric | Score |\n|--------|-------|\n| Performance | ${perf} |\n| Accessibility | ${a11y} |\n| Best Practices | ${bp} |\n| SEO | ${seo} |`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
