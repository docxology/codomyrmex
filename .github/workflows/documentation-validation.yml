name: Documentation Quality Gate

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/documentation/**'
      - '.github/workflows/documentation-validation.yml'
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly full scan on Sunday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.10.8"

jobs:
  validate-links:
    name: Validate Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Create output directory
        run: mkdir -p output

      - name: Run link validation
        run: |
          uv run python scripts/documentation/validate_links_comprehensive.py \
            --repo-root . \
            --output output \
            --format both \
            --fail-on-broken

      - name: Upload link validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-validation-results
          path: |
            output/link_validation.json
            output/link_validation.md
          retention-days: 30

      - name: Display link validation summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/link_validation.json")
          if path.exists():
              data = json.loads(path.read_text())
              broken = sum(
                  1 for result in data if result.get("status") == "broken"
              )
              ok = sum(1 for result in data if result.get("status") == "ok")
              external = sum(
                  1 for result in data if result.get("status") == "external"
              )
              print("\n## Link Validation Summary")
              print(f"- Total link checks: {len(data)}")
              print(f"- OK: {ok}")
              print(f"- Broken: {broken}")
              print(f"- External: {external}")
          PY

  check-quality:
    name: Check Content Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Create output directory
        run: mkdir -p output

      - name: Analyze content quality
        run: |
          uv run python scripts/documentation/analyze_content_quality.py \
            --repo-root . \
            --output output \
            --format both \
            --min-score 70 \
            --fail-on-below

      - name: Upload quality results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-analysis-results
          path: |
            output/content_quality.json
            output/content_quality.md
          retention-days: 30

      - name: Display quality summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/content_quality.json")
          if path.exists():
              data = json.loads(path.read_text())
              count = len(data)
              average = (
                  sum(result["score"] for result in data) / count
                  if count
                  else 0
              )
              placeholders = sum(
                  result["metrics"].get("placeholder_count", 0)
                  for result in data
              )
              low = sum(1 for result in data if result["score"] < 60)
              print("\n## Content Quality Summary")
              print(f"- Files analyzed: {count}")
              print(f"- Average score: {average:.1f}/100")
              print(f"- Total placeholders: {placeholders}")
              print(f"- Files below 60: {low}")
          PY

  validate-structure:
    name: Validate AGENTS.md Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Create output directory
        run: mkdir -p output

      - name: Validate AGENTS.md structure
        run: |
          uv run python scripts/documentation/validate_agents_structure.py \
            --repo-root . \
            --output output \
            --format both \
            --fail-on-invalid

      - name: Upload structure validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-structure-results
          path: |
            output/agents_validation.json
            output/agents_validation.md
          retention-days: 30

      - name: Display structure validation summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/agents_validation.json")
          if path.exists():
              data = json.loads(path.read_text())
              total = len(data)
              valid = sum(1 for result in data if result.get("valid"))
              print("\n## AGENTS.md Structure Summary")
              print(f"- Total files: {total}")
              print(f"- Valid files: {valid}")
              print(f"- Invalid files: {total - valid}")
          PY

  generate-dashboard:
    name: Generate Documentation Dashboard
    needs: [validate-links, check-quality, validate-structure]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Create output directory
        run: mkdir -p output

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate results
        run: |
          # Move all JSON results to output directory
          find artifacts -name "*.json" -exec cp {} output/ \;
          find artifacts -name "*.html" -exec cp {} output/ \;

      - name: Generate dashboard
        run: |
          uv run python scripts/documentation/generate_dashboard.py \
            --repo-root . \
            --output output

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: documentation-dashboard
          path: output/dashboard.html
          retention-days: 90

      - name: Publish dashboard to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: documentation-quality
          keep_files: false

  enforce-quality-gate:
    name: Enforce Quality Gates
    needs: [validate-links, check-quality, validate-structure]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Create output directory
        run: mkdir -p output

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate results
        run: |
          find artifacts -name "*.json" -exec cp {} output/ \;

      - name: Enforce quality gates
        run: |
          uv run python scripts/documentation/enforce_quality_gate.py \
            --repo-root . \
            --output output \
            --min-quality-score 70 \
            --max-broken-links 10 \
            --max-placeholders 100 \
            --min-agents-valid-rate 100

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📚 Documentation Quality Check Results\n\n';

            // Add summary from each validation
            const files = [
              'output/link_validation.json',
              'output/content_quality.json',
              'output/agents_validation.json'
            ];

            for (const file of files) {
              if (fs.existsSync(file)) {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                if (file.includes('link_validation')) {
                  const broken = Array.isArray(data) ? data.filter(r => r.status === 'broken').length : 0;
                  const total = Array.isArray(data) ? data.length : 0;
                  comment += '### 🔗 Link Validation\n';
                  comment += `- Link checks: ${total}\n`;
                  comment += `- Broken: ${broken}\n\n`;
                } else if (file.includes('content_quality')) {
                  const arr = Array.isArray(data) ? data : [];
                  const n = arr.length;
                  const avg = n ? arr.reduce((s, q) => s + (q.score || 0), 0) / n : 0;
                  const ph = arr.reduce((s, q) => s + (q.metrics?.placeholder_count || 0), 0);
                  comment += '### 📊 Content Quality\n';
                  comment += `- Average score: ${avg.toFixed(1)}/100\n`;
                  comment += `- Total placeholders: ${ph}\n\n`;
                } else if (file.includes('agents_validation')) {
                  const arr = Array.isArray(data) ? data : [];
                  const total = arr.length;
                  const valid = arr.filter(a => a.valid).length;
                  comment += '### 🤖 AGENTS.md Structure\n';
                  comment += `- Valid files: ${valid}/${total}\n`;
                  comment += `- Invalid files: ${total - valid}\n\n`;
                }
              }
            }

            comment += '\n[View detailed dashboard →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
