# Dependabot configuration for Codomyrmex
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two things this file has to get right for Python, and both fail silently:
#
# 1. `uv.lock` belongs to the `uv` ecosystem, not `pip`. The `pip` ecosystem
#    reads `requirements*.txt` and PEP 621 `pyproject.toml` only, so a `pip`
#    block here updated `pyproject.toml` declarations and never wrote either
#    lock. This matches the repository's own rule in `.github/AGENTS.md`
#    ("Use `uv` (not pip/poetry) for Python dependency management").
# 2. `directory` (singular) matches one path and does not recurse. Covering
#    both locks needs `directories` (plural) with every path named; this
#    repository has /uv.lock and /projects/test_project/uv.lock.
#
# Security alerts and security-update PRs do not depend on this file -- GitHub
# raises the first from the dependency graph and opens the second from the
# alert. Only *version* updates come from here. So a missing coverage path does
# not surface as an error; it surfaces as an untouched lock and a growing alert
# count, which is exactly how this file went stale.

version: 2

updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "astral-sh/*"
          - "github/*"
          - "semgrep/*"
          - "pypa/*"
          - "peter-evans/*"
          - "peaceiris/*"
          - "trufflesecurity/*"
          - "Mattraks/*"
          - "dorny/*"
    reviewers:
      - "docxology"
    assignees:
      - "docxology"

  # Python dependencies
  - package-ecosystem: "uv"
    # Every uv.lock in the repository, named explicitly. `directory` (singular)
    # matches one path only and does not recurse, so "/" alone left
    # /projects/test_project/uv.lock with no version-update coverage at all.
    directories:
      - "/"
      - "/projects/test_project"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor/patch bumps into a single PR
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Focus on security updates for Python
    allow:
      - dependency-type: "direct"
    ignore:
      # Ignore major version updates (require manual review)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "docxology"
    assignees:
      - "docxology"

  # Node.js dependencies for documentation build
  - package-ecosystem: "npm"
    directory: "/src/codomyrmex/documentation"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      js-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "docxology"
    assignees:
      - "docxology"
