site_name: Codomyrmex
site_url: https://docxology.github.io/codomyrmex/
repo_url: https://github.com/docxology/codomyrmex
repo_name: docxology/codomyrmex
site_description: A Modular, Extensible Coding Workspace — Documentation

hooks:
  - scripts/documentation/mkdocs_hooks.py

# Canonicalize directories that contain both README.md and index.md by keeping
# index.md in the site. Raw Pandoc report sections are compiled separately and
# linked through the generated semantic HTML artifact.
exclude_docs: |
  /README.md
  /security/README.md
  /skills/README.md
  /modules/agents/README.md
  /modules/data_visualization/README.md
  /modules/defense/README.md
  /modules/embodiment/README.md
  /modules/environment_setup/README.md
  /modules/git_operations/README.md
  /modules/logging_monitoring/README.md
  /modules/model_context_protocol/README.md
  /modules/module_template/README.md
  /modules/physical_management/README.md
  /modules/security/README.md
  /modules/spatial/README.md
  /modules/website/README.md
  /manuscript/[0-9]*.md
  /manuscript/preamble.md

# The repository contains a broad reference corpus. Navigation is curated
# below; unlisted pages remain searchable and linkable without warning.
not_in_nav: |
  **

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Technical Report: manuscript/technical-report.html
  - Getting Started:
      - Overview: getting-started/README.md
      - Tutorials:
          - Overview: getting-started/tutorials/README.md
          - Creating a Module: getting-started/tutorials/creating-a-module.md
          - Connecting PAI: getting-started/tutorials/connecting-pai.md
          - Using MCP Tools: getting-started/tutorials/using-mcp-tools.md
          - Running Tests: getting-started/tutorials/running-tests.md
      - Agent Operations: getting-started/GETTING_STARTED_WITH_AGENTS.md
  - Architecture:
      - Overview: project/architecture.md
  - API Reference:
      - Overview: reference/api.md
  - Contributing: project/contributing.md
  - Changelog: reference/changelog.md

extra:
  source_branch: main
  technical_report_source: output/paper.html
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/docxology/codomyrmex
  version:
    provider: mike
